depends_on:
  - deploy

when:
  - event: push
    branch: main

steps:
  sync-github:
    image: alpine:3.20
    environment:
      GH_TOKEN:
        from_secret: github_token
    commands:
      - apk add --no-cache git github-cli
      - git remote add github "https://x-access-token:$${GH_TOKEN}@github.com/pedrolucasfonseca/HomeLab.git"
      - SYNC_BRANCH="sync/gitea-$(echo $CI_COMMIT_SHA | cut -c1-8)"
      - git fetch --unshallow || true
      - git push github HEAD:refs/heads/$SYNC_BRANCH
      - gh pr create --repo pedrolucasfonseca/HomeLab --base main --head "$SYNC_BRANCH" --title "sync gitea main @ $SYNC_BRANCH" --body "Sincronização automática pós-pipeline verde no Gitea (commit ${CI_COMMIT_SHA})."
      - gh pr merge "$SYNC_BRANCH" --repo pedrolucasfonseca/HomeLab --auto --merge
