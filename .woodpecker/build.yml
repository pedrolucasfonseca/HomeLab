depends_on:
  - test

when:
  - event: [push, pull_request]

steps:
  build:
    image: woodpeckerci/plugin-kaniko
    settings:
      registry: 192.168.122.96:30500
      repo: homelab-backend
      dockerfile: backend/Dockerfile
      context: backend
      tags:
        - ${CI_COMMIT_SHA}
        - latest
      insecure: true
      insecure_pull: true
      skip_tls_verify: true
