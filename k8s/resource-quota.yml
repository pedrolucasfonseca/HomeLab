apiVersion: v1
kind: ResourceQuota
metadata:
  name: homelab-quota
  namespace: homelab
spec:
  hard:
    requests.cpu: "1500m"
    requests.memory: 1.5Gi
    limits.cpu: "3"
    limits.memory: 3Gi
    pods: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: homelab-limits
  namespace: homelab
spec:
  limits:
    - type: Container
      default:
        cpu: "250m"
        memory: 256Mi
      defaultRequest:
        cpu: "100m"
        memory: 128Mi
