apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: homelab-wildcard
  namespace: homelab
spec:
  secretName: homelab-tls
  commonName: "*.homelab.local"
  dnsNames:
    - "homelab.local"
    - "*.homelab.local"
  issuerRef:
    name: homelab-ca-issuer
    kind: ClusterIssuer
    group: cert-manager.io
